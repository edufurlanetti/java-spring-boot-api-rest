# Opcional: PostgreSQL para rodar a API com o perfil "postgres"
services:
  postgres:
    image: postgres:16
    container_name: manutencao-postgres
    environment:
      POSTGRES_DB: manutencao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
